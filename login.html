<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memon Academy - Student Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <img src="https://play-lh.googleusercontent.com/qq0c98uSwy75mXoGfO84tPXzZM2APekjrKWxK9twYabVveImVCjpavR6AiHrMv12Gg=w600-h300-pc0xffffff-pd" alt="Memon Academy Logo">
            <p>Memon Academy</p>
        </div>
        <nav class="links">
            <a href="index.html">Home</a>
            <a href="#">About Us</a>
            <a href="services.html">Our Services</a>
            <a href="#">Career</a>
            <a href="contact.html">Contact Us</a>
            <a href="./register.html">Student Login</a>
        </nav>
    </header>

    <!-- Student Login Container -->
    <main class="main">
        <h2>Student Login Form</h2>
       
        <img src="https://cdn-icons-png.flaticon.com/512/4661/4661334.png" alt="Login Icon">

        <form id="loginForm" action="#" method="post">
            <div class="row1">
                <label for="username">User Name</label>
                <input type="text" id="username" name="username" placeholder="Student User Name" required autocomplete="username">
            </div>

            <div class="row2">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Student Password" required autocomplete="current-password">
            </div>

            <div class="row3">
                <button type="submit">Login</button>
            </div>
        </form>

        <div class="row4">
            <p>Don't have an account? <a href="register.html">Register Now</a></p>
        </div>
    </main>

</body>
</html>
