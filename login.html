<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memon Academy - Student Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <img src="https://play-lh.googleusercontent.com/qq0c98uSwy75mXoGfO84tPXzZM2APekjrKWxK9twYabVveImVCjpavR6AiHrMv12Gg=w600-h300-pc0xffffff-pd" alt="Memon Academy Logo">
            <p>Memon Academy</p>
        </div>
        <nav class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Our Services</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html" class="active">Student Login</a>
        </nav>
    </header>

    <!-- Main Login Section -->
    <main class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="avatar-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/4661/4661334.png" alt="Student Login Icon">
                </div>
                <h2>Welcome Back</h2>
                <p>Please enter your credentials to access your student portal.</p>
            </div>

            <form id="loginForm" class="modern-form" action="#" method="post">
                
                <!-- Floating Label Username Field -->
                <div class="floating-group">
                    <input type="text" id="username" name="username" placeholder=" " required autocomplete="username">
                    <label for="username">Username or Email</label>
                </div>

                <!-- Floating Label Password Field with Toggle -->
                <div class="floating-group password-group">
                    <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Password</label>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Form Options: Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-pass">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Sign In</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="register.html">Register Now</a></p>
            </div>

        </div>
    </main>

    <!-- Password Toggle Script -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('active');
        });
    </script>

</body>
</html>
